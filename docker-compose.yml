# Startup: Postgres + the middleware configured for it.
#
#   cp .env.example .env
#   printf 'JWT_SECRET=%s\n'         "$(openssl rand -base64 48)" >> .env
#   printf 'SEED_USER_PASSWORD=%s\n' "$(openssl rand -base64 18)" >> .env
#   docker compose up --build
#
# It is three commands rather than one by design. Every value that can authenticate — the JWT
# signing key and the seed-user password — uses `${VAR:?message}` and has no fallback, so Compose
# stops with a readable error instead of starting a Production-profile service on credentials that
# are readable in this repository. `.env.example` declares both keys and ships neither value.
#
# This mirrors what the app itself does: the connection string is required under the Postgres
# provider, `Jwt:Secret` is validated on start, and enabling the seeder without a password now fails
# validation on start too, so neither layer depends on the other to be safe.

# Explicit, so the project name (and therefore container and volume names) does not change if the
# checkout directory is renamed.
name: abysalto-middleware

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: middleware
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # The app reaches the DB over the internal Compose network (db:5432); the host mapping is for
    # local inspection only, bound to loopback so the demo credentials are never exposed to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d middleware"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Not Development, so the service logs compact JSON rather than the readable console pattern.
      ASPNETCORE_ENVIRONMENT: Production
      # Double underscore is the configuration-key separator, so these bind to the same options
      # objects appsettings.json populates.
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=middleware;Username=${DB_USERNAME};Password=${DB_PASSWORD}
      # Required — no fallback. Compose fails fast (like the app does) if unset, so a known signing
      # key is never committed. Provide it via `.env` (copy from `.env.example`) or the shell.
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env (copy .env.example)}
      # Seed a user so the JWT-protected API is testable immediately.
      #
      # The password is required with no fallback, exactly like JWT_SECRET above. A defaulted one
      # would publish a known-credential account on a Production-profile service — precisely what
      # appsettings.json says must never happen. `.env.example` declares the key and ships no value,
      # so `cp .env.example .env && docker compose up` stops here with the message below rather than
      # starting with a password anyone can read off the repository.
      #
      # The username keeps a default: it is not a secret, and the account is only reachable by
      # someone who already has the password. Requiring it would add friction, not safety.
      #
      # Compose interpolates `:?` unconditionally, so there is deliberately no `SEED_USER_ENABLED`
      # switch here — it could not skip the requirement, only appear to. To run with no seeded
      # account, override `Security__SeedUser__Enabled` in a compose override file.
      Security__SeedUser__Enabled: "true"
      Security__SeedUser__Username: ${SEED_USER_USERNAME:-demo}
      Security__SeedUser__Password: ${SEED_USER_PASSWORD:?set SEED_USER_PASSWORD in .env (copy .env.example) — no default, so the demo stack never ships a known password}
      # CORS is an allowlist and ships empty, so no browser origin may read a response — correct for
      # this stack, which is driven by curl and the Swagger UI (same-origin, unaffected). A browser
      # client needs its exact origin here, indexed, with no trailing slash; a malformed one fails
      # start-up rather than silently matching nothing:
      #   Cors__AllowedOrigins__0: https://app.example.com
    ports:
      - "8080:8080"

volumes:
  pgdata:
