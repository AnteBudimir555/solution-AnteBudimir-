# One-command startup for the .NET service: Postgres + the middleware configured for it.
#
#   cp .env.example .env      # then edit JWT_SECRET for anything real
#   docker compose -f docker-compose.dotnet.yml up --build
#
# A separate file from docker-compose.yml, which runs the Java service. Both read the same `.env`
# and can run at once — this stack uses its own volume and its own host ports (8081 for the API,
# 5433 for Postgres), which is what lets the shadowing harness replay a corpus against both.
#
# Like the Java service, the Postgres configuration has NO defaults for DB_USERNAME / DB_PASSWORD /
# JWT_SECRET: the connection string is required under the Postgres provider and startup throws
# without it, and `Jwt:Secret` is validated on start. This file mirrors that — JWT_SECRET has no
# fallback here either, so Compose fails fast with a helpful message rather than baking a known
# signing key into a tracked file.

# An explicit project name. Without it Compose derives one from the directory, which both files share
# — so bringing this stack up would recreate the Java stack's containers instead of running beside it.
name: abysalto-middleware-dotnet

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: middleware
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # The app reaches the DB over the internal Compose network (db:5432); no host mapping is needed.
    # Bind to loopback only so the demo credentials are never exposed to the host/LAN. The port
    # differs from the Java stack's so both can be up together.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-dotnet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d middleware"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./dotnet
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Not Development, so the service logs compact JSON — the analog of the Java `postgres`
      # profile's logstash encoder.
      ASPNETCORE_ENVIRONMENT: Production
      # Double underscore is the configuration-key separator, so these bind to the same options
      # objects appsettings.json populates.
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=middleware;Username=${DB_USERNAME};Password=${DB_PASSWORD}
      # Required — no fallback. Compose fails fast (like the app does) if unset, so a known signing
      # key is never committed. Provide it via `.env` (copy from `.env.example`) or the shell.
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env (copy .env.example)}
      # Demo only: seed a known user so the JWT-protected API is testable immediately. Seeding is
      # disabled by default and stays off unless enabled explicitly, as it is here.
      Security__SeedUser__Enabled: "true"
      Security__SeedUser__Username: ${SEED_USER_USERNAME:-demo}
      Security__SeedUser__Password: ${SEED_USER_PASSWORD:-demo1234}
    ports:
      - "8081:8080"

volumes:
  pgdata-dotnet:
